[project]
name = "recon"
version = "0.1.0"
description = "Chain together bug bounty tools to check for simple issues and build a set of resources for manual testing"
readme = "README.md"
authors = [
    { name = "Rafe Hart" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
recon = "recon.recon:main"
reconsite = "recon.reconsite:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "pkg"
