# Built-in sensitive paths. Each is requested once per live web service.
# Every entry needs a signature (an RE2 over the first 1 MiB of the body) and/or magic
# (a hex body prefix) so a catch-all site that answers 200 to everything is not flagged,
# and an explicit severity. status defaults to 200.
#
# Requests are made entry by entry in severity order (high, medium, low) and, within a
# severity, in the order of this file, so put the most telling entries first.
#
# The first 23 entries are the list as it was when the check keys were first recorded;
# their signature, magic and status must never change (a test pins them), or every
# engagement would request them again and strand its earlier hits. New entries go
# at the end of their severity group.
