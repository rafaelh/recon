# Shared-infrastructure recognition. Embedded in the binary; edit and rebuild to extend.
#
# cname: a CNAME target that ends with `suffix` (on a label boundary) is hosted by that provider.
# asn:   an address whose origin AS is listed belongs to the provider. `class` is
#        cdn and shared-hosting (always shared), hyperscaler (shared unless a
#        provider range proves the address is a dedicated virtual machine) or
#        saas (a third-party platform serving other companies' content).
#
# cname entries may also carry:
#   class: saas      the host is served by a third-party SaaS platform, never requested for sensitive paths
#   nxdomain: true   a chain that dangles into the suffix can be claimed by anyone (a takeover)
#   body: <RE2>      matches the page an unclaimed resource serves; a takeover when a probe sees it
# and a `ranges:` list of static CIDRs (SaaS reached by apex A records).
#
# txt:     a root TXT record that starts with `prefix` (case-insensitive) is a domain-ownership
#          verification for `platform`. Only the platform is reported; the token is not.
# domains: a domain that ends with `suffix` (on a label boundary) is operated by `provider`, such
#          as the managed DNS service behind a name server.
# The Salesforce prefix has not been re-confirmed against a live record. Amazon Route 53 name servers
# (awsdns-NN.com, .net, .org and .co.uk) are not listed: their number is in the label, so a suffix cannot match them.
# The fingerprints, ASNs and ranges below are a hand-curated starter set; they change only with the binary.
# The Squarespace and Wix ASNs and the Squarespace ranges were taken from the providers' published
# documentation and have not been re-confirmed against live data.
