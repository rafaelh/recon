# Shared-infrastructure recognition (Spec 2, B8). Embedded in the binary; edit and rebuild to extend.
#
# cname: a CNAME target that ends with `suffix` (on a label boundary) is hosted by that provider.
# asn:   an address whose origin AS is listed belongs to the provider. `class` is
#        cdn and shared-hosting (always shared) or hyperscaler (shared unless a
#        provider range proves the address is a dedicated virtual machine).
